<div class="card" [formGroup]="form">
  <div class="card-header">
    <h5 class="card-title mb-0">
      <i class="fas" [ngClass]="isEdit ? 'fa-edit' : 'fa-plus'" class="me-2"></i>
      {{ isEdit ? 'Edit Question' : 'Create Question' }}
    </h5>
  </div>

  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Assessment<span class="text-danger">*</span></label>
        <select class="form-select" formControlName="assessmentId">
          <option value="">Select assessment</option>
          <option *ngFor="let assessment of assessments" [value]="assessment.id">
            {{ assessment.title }} ({{ assessment.type }})
          </option>
        </select>
        <div class="text-danger small" *ngIf="form.get('assessmentId')?.invalid && form.get('assessmentId')?.touched">
          Assessment is required.
        </div>
      </div>
      <div class="col-md-3">
        <label class="form-label">Question Number<span class="text-danger">*</span></label>
        <input type="number" min="1" class="form-control" formControlName="questionNumber" />
        <div class="text-danger small" *ngIf="form.get('questionNumber')?.invalid && form.get('questionNumber')?.touched">
          Provide a positive question number.
        </div>
      </div>
      <div class="col-md-3">
        <label class="form-label">Max Mark<span class="text-danger">*</span></label>
        <input type="number" min="0.5" step="0.5" class="form-control" formControlName="maxMark" />
        <div class="text-danger small" *ngIf="form.get('maxMark')?.invalid && form.get('maxMark')?.touched">
          Provide a valid mark greater than zero.
        </div>
      </div>
      <div class="col-md-4">
        <label class="form-label">Question Type<span class="text-danger">*</span></label>
        <select class="form-select" formControlName="questionType">
          <option value="">Select type</option>
          <option *ngFor="let type of questionTypes" [value]="type.value">{{ type.label }}</option>
        </select>
        <div class="text-danger small" *ngIf="form.get('questionType')?.invalid && form.get('questionType')?.touched">
          Question type is required.
        </div>
      </div>
      <div class="col-md-8">
        <label class="form-label">Question Text<span class="text-danger">*</span></label>
        <textarea rows="4" class="form-control" formControlName="text" placeholder="Enter the question text..."></textarea>
        <div class="text-danger small" *ngIf="form.get('text')?.invalid && form.get('text')?.touched">
          Question text is required (max 2000 characters).
        </div>
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea rows="3" class="form-control" formControlName="description" placeholder="Optional guidance or notes for graders..."></textarea>
      </div>
    </div>
  </div>

  <div class="card-footer d-flex justify-content-end gap-2">
    <button class="btn btn-outline-secondary" type="button" (click)="cancel()" [disabled]="saving">
      Cancel
    </button>
    <button class="btn btn-primary" type="button" (click)="save()" [disabled]="saving">
      <i class="fas" [ngClass]="saving ? 'fa-spinner fa-spin' : 'fa-save'" class="me-1"></i>
      {{ saving ? 'Saving...' : 'Save' }}
    </button>
  </div>
</div>
